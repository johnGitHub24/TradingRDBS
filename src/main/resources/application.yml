server:
  port: 8095

spring:
  application:
    name: trading-rdbs
  datasource:
    url: ${DB_URL:jdbc:h2:mem:rdbs;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:TradingRDBS-dev-jwt-secret-at-least-32-bytes-long}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  demo:
    username: ${DEMO_USERNAME:demo}
    password: ${DEMO_PASSWORD:demo123}

startup:
  info:
    enabled: true
    project-name: TradingRDBS
    frontend: static
    auth: true
    h2: true
    api-docs: true
    probe: true
    home-path: /
    extra-paths:
      - /blueprint/
      - /docs/portals/service-links.html

springdoc:
  swagger-ui:
    path: /swagger-ui.html
