server:
  port: 8095

spring:
  application:
    name: trading-rdbs
  datasource:
    url: ${DB_URL:jdbc:h2:mem:rdbs;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info

startup:
  info:
    enabled: true
    project-name: TradingRDBS
    frontend: static
    auth: false
    h2: true
    api-docs: true
    probe: true
    home-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
