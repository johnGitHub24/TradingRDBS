plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.trading'
version = '0.1.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    description = 'Runs unit tests (excludes @Tag integration)'
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (@Tag integration)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

/**
 * 【職責】產出 docs/javadoc（EOS 必跑靜態頁；對齊 FinTechDemo aggregateJavadoc）。
 * 【技巧】failOnError false 避免 doclint 擋住 check；產物由 sync-demo-static-artifacts 複製到 static。
 */
tasks.register('aggregateJavadoc', Javadoc) {
    group = 'documentation'
    description = 'Generate JavaDoc HTML into docs/javadoc'
    dependsOn tasks.named('classes')
    source = sourceSets.main.allJava
    classpath = files(sourceSets.main.compileClasspath, sourceSets.main.output)
    destinationDir = file("${rootDir}/docs/javadoc")
    title = "TradingRDBS ${version} API"
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.links('https://docs.oracle.com/en/java/javase/21/docs/api/')
    failOnError = false
}

/**
 * 【職責】把 Javadoc／Gradle HTML 測試報告覆寫進 bootRun classpath（避免 404）。
 * 【開關】docs/eos-demo.profile.json presentationLayer；見 demo-presentation-switch.md
 */
def eosDemoPresentationOn = {
    def prop = findProperty('eosDemoPresentation')
    if (prop != null) {
        return !['false', '0', 'off'].contains(prop.toString().toLowerCase())
    }
    def profileFile = file('docs/eos-demo.profile.json')
    if (!profileFile.exists()) {
        profileFile = file('eos-demo.profile.json')
    }
    if (profileFile.exists()) {
        def text = profileFile.text
        if (text =~ /"demoPresentation"\s*:\s*"on"/) return true
        if (text =~ /"demoPresentation"\s*:\s*"off"/) return false
        if (text =~ /"presentationLayer"\s*:\s*true/) return true
        if (text =~ /"presentationLayer"\s*:\s*false/) return false
    }
    return false
}()

tasks.register('syncDemoStaticToClasspath') {
    group = 'documentation'
    description = 'Mirror Javadoc + test HTML into build/resources/main/static/docs for bootRun'
    onlyIf { eosDemoPresentationOn }

    doLast {
        def classpathDocs = file("${layout.buildDirectory.get().asFile}/resources/main/static/docs")
        def srcDocs = file('src/main/resources/static/docs')

        def mirrorTree = { File sourceDir, File dest ->
            if (sourceDir == null || !sourceDir.exists() || !new File(sourceDir, 'index.html').exists()) {
                return false
            }
            if (dest.exists()) {
                dest.deleteDir()
            }
            dest.mkdirs()
            copy {
                from sourceDir
                into dest
            }
            true
        }

        def javadocSrc = file('docs/javadoc')
        if (mirrorTree(javadocSrc, new File(classpathDocs, 'javadoc'))) {
            mirrorTree(javadocSrc, new File(srcDocs, 'javadoc'))
        }

        def unitBuild = file('build/reports/tests/test')
        def unitSrc = new File(srcDocs, 'reports/unit')
        def unitFrom = (unitBuild.exists() && new File(unitBuild, 'index.html').exists()) ? unitBuild : unitSrc
        if (mirrorTree(unitFrom, new File(classpathDocs, 'reports/unit'))) {
            if (unitBuild.exists() && new File(unitBuild, 'index.html').exists()) {
                mirrorTree(unitBuild, new File(srcDocs, 'reports/unit'))
            }
        }

        def intBuild = file('build/reports/tests/integrationTest')
        def intSrc = new File(srcDocs, 'reports/integration')
        def intFrom = (intBuild.exists() && new File(intBuild, 'index.html').exists()) ? intBuild : intSrc
        if (mirrorTree(intFrom, new File(classpathDocs, 'reports/integration'))) {
            if (intBuild.exists() && new File(intBuild, 'index.html').exists()) {
                mirrorTree(intBuild, new File(srcDocs, 'reports/integration'))
            }
        }
    }
}

tasks.named('syncDemoStaticToClasspath').configure {
    dependsOn tasks.named('processResources')
}

tasks.named('bootRun').configure {
    dependsOn tasks.named('processResources')
    dependsOn tasks.named('syncDemoStaticToClasspath')
    group = 'application'
    description = 'Run backend at http://localhost:8095'
    jvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dstdout.encoding=UTF-8',
            '-Dstderr.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8'
    ]
}

springBoot {
    mainClass = 'com.trading.rdbs.TradingRdbsApplication'
}
